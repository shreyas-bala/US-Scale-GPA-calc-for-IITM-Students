<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IITM → US GPA Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
    }
    input, button {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <h1>IITM → US GPA Calculator (4.0 Scale)</h1>

  <p>
    Upload your <strong>IIT Madras transcript PDF</strong>.
    Privacy notice:
    Your transcript is processed entirely in your browser.
    No files are uploaded, stored, or shared with any server.
    The source code is available
    <a href="https://github.com/shreyas-bala/US-Scale-GPA-calc-for-IITM-Students/blob/main/index.html" target="_blank" rel="noopener noreferrer">here</a>
    for transparency.
  </p>

  <input type="file" id="pdfInput" accept="application/pdf">
  <br>
  <button onclick="processPDF()">Calculate GPA</button>

  <h2 id="result"></h2>

  <table id="breakdown" border="1" cellpadding="8" style="margin-top:20px; display:none;">
    <thead>
      <tr>
        <th>US GPA</th>
        <th>IIT Grade(s)</th>
        <th>Credits</th>
      </tr>
    </thead>
    <tbody id="breakdownBody"></tbody>
  </table>


    <script>
      const gradeMap = {
        'S': 4.0,
        'A': 4.0,
        'B': 3.5,
        'C': 3.0,
        'D': 2.5,
        'E': 2.0,
        'U': 0.0
      };

      const buckets = {
        4.0: ['S', 'A'],
        3.5: ['B'],
        3.0: ['C'],
        2.5: ['D'],
        2.0: ['E'],
        0.0: ['U']
      };

      async function processPDF() {
        const file = document.getElementById('pdfInput').files[0];
        if (!file) {
          alert("Please upload a transcript PDF.");
          return;
        }

        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        let totalCredits = 0;
        let totalPoints = 0;

        let creditBreakdown = {
          4.0: 0,
          3.5: 0,
          3.0: 0,
          2.5: 0,
          2.0: 0,
          0.0: 0
        };

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const text = textContent.items.map(item => item.str).join(" ");

          const matches = [...text.matchAll(/\b(\d+)\s+([SABCDEU])\b/g)];

          matches.forEach(m => {
            const credits = parseInt(m[1]);
            const grade = m[2];

            if (credits === 0 || grade === 'P') return;

            const gpa = gradeMap[grade];
            totalCredits += credits;
            totalPoints += credits * gpa;
            creditBreakdown[gpa] += credits;
          });
        }

        const gpaFinal = totalPoints / totalCredits;

        document.getElementById("result").innerText =
          `GPA (4.0 scale): ${gpaFinal.toFixed(2)} | Total Credits: ${totalCredits}`;

        const tbody = document.getElementById("breakdownBody");
        tbody.innerHTML = "";

        for (const gpa in buckets) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${gpa}</td>
            <td>${buckets[gpa].join(", ")}</td>
            <td>${creditBreakdown[gpa]}</td>
          `;
          tbody.appendChild(row);
        }

        document.getElementById("breakdown").style.display = "table";
      }
    </script>
